name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r typecheck

      - run: pnpm -r test

      # ra-choi-server.workers.dev — Durable Object (GameRoom) holding every online room's state.
      - name: Deploy server (Cloudflare Worker)
        working-directory: apps/server
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build client
        working-directory: apps/client
        run: pnpm build
        env:
          VITE_SERVER_URL: https://ra-choi-server.nguyenhainam9122003.workers.dev

      # thu-gian.pages.dev — the public site. --force stays on Cloudflare's older Pages deploy
      # path; the newer one (Workers + static assets) demands Vite >=6, and this repo is on 5.4.
      - name: Deploy client (Cloudflare Pages)
        working-directory: apps/client
        run: npx wrangler pages deploy dist --project-name=thu-gian --force --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
